[project]
name = "podcast-index"
version = "0.1.0"
description = "Topic index of the Tierisch Menschlich podcast for the Hundewissen pages"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=1.8",
  "mlx-whisper>=0.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
